name: Bot de trading (portefeuille fictif)

# Deux rythmes :
#   - toutes les heures : le bot decide et journalise (forward testing)
#   - a 20h05 UTC (22h05 Paris, cloture de la session de New York) : rapport du soir
#
# Aucun secret n'est necessaire pour faire tourner le bot : il n'utilise que
# des donnees de marche publiques et ne passe aucun ordre reel.

on:
  schedule:
    - cron: "5 * * * *"     # toutes les heures a HH:05, une fois la bougie close
    - cron: "5 20 * * *"    # rapport du soir (20h05 UTC = 22h05 Paris en ete)
  workflow_dispatch:         # bouton "Run workflow" pour declencher a la main
    inputs:
      force_report:
        description: "Generer le rapport meme hors de l'horaire du soir"
        type: boolean
        default: false

# Une seule execution a la fois : deux passages simultanes pourraient
# ecrire dans le journal en meme temps.
concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write   # necessaire pour commiter le journal de forward testing

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # config.ci.json utilise l'adaptateur Coinbase : Binance renvoie une
      # erreur 451 depuis les IP americaines, et les runners GitHub le sont.
      BOT_CONFIG: config.ci.json
      # Vide si le secret n'existe pas : l'etape Netlify se saute alors seule.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Notification telephone. Vide si le secret n'existe pas : les etapes
      # de notification se sautent alors toutes seules.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        # Aucune dependance a installer : le bot n'utilise que la
        # bibliotheque standard.

      - name: Restaurer le cache des donnees de marche
        uses: actions/cache@v4
        with:
          path: data
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Verifier la configuration
        run: python -m bot.cli --config "$BOT_CONFIG" check

      - name: Decider et journaliser
        run: python -m bot.cli --config "$BOT_CONFIG" tick

      - name: Determiner s'il faut produire le rapport
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "5 20 * * *" ] || \
             [ "${{ inputs.force_report }}" = "true" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rapport du soir
        if: steps.mode.outputs.report == 'true'
        run: |
          python -m bot.cli --config "$BOT_CONFIG" daily | tee sortie_daily.txt
          # Page separee : ce que le forward test EN DIRECT a reellement
          # gagne ou perdu (jamais le backtest rejoue par 'daily' ci-dessus).
          python -m bot.cli --config "$BOT_CONFIG" forward-report

      - name: Etat du forward testing
        run: python -m bot.cli --config "$BOT_CONFIG" forward-status | tee sortie_forward.txt

      # --- Notifications telephone (ntfy.sh) --------------------------
      # Volontairement PAS a chaque passage horaire : 24 notifications par
      # jour deviennent du bruit qu'on finit par couper, et on rate alors
      # celles qui comptaient. On notifie ce qui porte une information :
      # le bilan du soir, une divergence, un echec.
      - name: Notifier le bilan du soir
        if: steps.mode.outputs.report == 'true' && env.NTFY_TOPIC != ''
        run: |
          RESUME=$(grep -E "capital|marche|trades|score  |journee" sortie_daily.txt | head -6)
          curl -sS -H "Title: Bilan du $(date -u '+%d/%m')" \
               -H "Tags: bar_chart" \
               -d "$RESUME" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null

      - name: Alerter en cas de divergence
        if: env.NTFY_TOPIC != ''
        run: |
          if grep -q "DIVERGENCES DETECTEES" sortie_forward.txt; then
            curl -sS -H "Title: Forward test rompu" -H "Priority: high" \
                 -H "Tags: warning" \
                 -d "Des decisions deja journalisees ont change. Un parametre a bouge : le compteur de forward testing repart de zero." \
                 "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi

      # Le journal est commite : l'historique git date chaque decision de
      # facon independante du bot lui-meme. C'est ce qui rend le forward
      # test verifiable plutot que declaratif.
      - name: Commiter le journal
        run: |
          if [ -n "$(git status --porcelain forward_log.jsonl)" ]; then
            git config user.name "trading-bot"
            git config user.email "bot@users.noreply.github.com"
            git add forward_log.jsonl
            git commit -m "journal: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Rien de nouveau a journaliser."
          fi

      - name: Publier le rapport en artefact
        if: steps.mode.outputs.report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-du-soir
          path: reports/
          retention-days: 90

      # --- Optionnel : publication sur Netlify -------------------------
      # Pour activer : cree un site Netlify vide, puis ajoute deux secrets
      # dans Settings > Secrets and variables > Actions :
      #   NETLIFY_AUTH_TOKEN  (Netlify > User settings > Applications)
      #   NETLIFY_SITE_ID     (Site settings > General > Site ID)
      # Sans ces secrets, l'etape est simplement sautee.
      - name: Publier le rapport sur Netlify
        if: steps.mode.outputs.report == 'true' && env.NETLIFY_AUTH_TOKEN != ''
        run: |
          cp "$(ls -t reports/rapport_*.html | head -1)" reports/index.html
          # --no-build est indispensable : sans lui, la CLI execute la commande
          # de build configuree dans l'interface Netlify (qui n'a rien a voir
          # avec ce projet) au lieu de se contenter d'envoyer le HTML deja pret.
          npx --yes netlify-cli@latest deploy \
            --no-build \
            --dir=reports --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "rapport du $(date -u '+%Y-%m-%d')"

      - name: Alerter en cas d'echec
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -sS -H "Title: Le bot a echoue" -H "Priority: high" \
               -H "Tags: rotating_light" \
               -d "Passage du $(date -u '+%d/%m a %H:%M') UTC en echec. Les logs sont dans l'onglet Actions." \
               "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
